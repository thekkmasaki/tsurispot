name: SNS ランキング投稿（Instagramリール / Threads）

# 毎日1本「◯月に△△が釣れる□□県の釣り場TOP10」を自動生成して投稿する。
# 生成器: scripts/sns/ranking-reel/（サイトの県×月×魚種ページと同じデータ・掲載基準）
#
# 投稿時刻: JST 20:00 ごろ（帰宅後のアクティブ帯）。
# GitHub の定時実行は 5〜15 時間も遅れ、ばらつく（2026-11: 15:17 指定が実際は翌3:30 起動＝未明に投稿されていた）。
# 遅れが読めないので、毎時起動して gate ジョブで判定する（公開リポジトリなので Actions は無料）:
#   - JST 12:00 前の起動 … 何もしない（未明・朝には投稿しない）
#   - 14:55〜19:55 の起動 … 19:55 まで待って投稿（待ちは最長5時間。それより早い起動は次の回に任せる）
#   - 19:55〜24:00 の起動 … すぐ投稿
#   - その日すでに投稿済みなら、どの時間でも何もしない（台帳を見るだけなので数秒で終わる）
# PC には頼らない（ユーザー方針）。
on:
  schedule:
    - cron: '23 * * * *'   # 毎時（遅れても、どれかが JST 15〜24時に当たる）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せずDiscordに画像プレビューだけ送る'
        type: boolean
        default: true
      pref:
        description: '県slugを固定（例: hyogo）。空なら自動選定'
        required: false
      fish:
        description: '魚種slugを固定（例: tachiuo）。空なら自動選定'
        required: false
      platforms:
        description: '投稿先'
        default: 'instagram,threads'

concurrency:
  group: sns-ranking-reel
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    outputs:
      date: ${{ steps.wait.outputs.date }}
      post: ${{ steps.wait.outputs.post }}
    env:
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - name: 投稿するか判定（JST 19:55〜24:00 に投稿・投稿済みなら何もしない）
        id: wait
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "post=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(TZ=Asia/Tokyo date +%F)
          posted() {
            curl -sf -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" "$UPSTASH_REDIS_REST_URL/lrange/sns:ranking:ledger/0/9" \
              | jq -r '.result[]' | jq -s --arg d "$today" 'any(.date == $d and .ok == true)' | grep -q true
          }
          if posted; then echo "$today は投稿済み → 何もしない"; echo "post=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          h=$(TZ=Asia/Tokyo date +%-H)
          now=$(date +%s); target=$(TZ=Asia/Tokyo date -d "today 19:55" +%s)
          if [ "$h" -lt 12 ]; then echo "JST ${h}時の起動 → 未明・朝は投稿しない"; echo "post=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          wait=$((target - now))
          if [ "$wait" -gt 18000 ]; then echo "19:55 まで $((wait/60))分（5時間超）→ 次の回に任せる"; echo "post=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$wait" -gt 0 ]; then echo "JST 19:55 まで $((wait/60))分待つ"; sleep "$wait"; fi
          # 待っている間に別の回が投稿していたら何もしない
          if posted; then echo "待機中に投稿済み → 何もしない"; echo "post=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "date=$today" >> "$GITHUB_OUTPUT"
          echo "post=true" >> "$GITHUB_OUTPUT"

  post:
    needs: gate
    if: needs.gate.outputs.post == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-1
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存インストール
        run: npm ci

      - name: 描画環境（Chromium・ffmpeg・日本語/絵文字フォント）
        run: |
          npx playwright install chromium --with-deps
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-color-emoji

      - name: BGM取得（非公開バケット。曲は再配布禁止のためリポジトリに置かない）
        run: |
          mkdir -p /tmp/bgm
          aws s3 sync s3://tsurispot-sns-assets/bgm/ /tmp/bgm/ --only-show-errors || echo "BGMなし（無音で続行）"
          ls /tmp/bgm

      - name: 生成して投稿
        env:
          SNS_BGM_DIR: /tmp/bgm
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
            [ -n "${{ inputs.pref }}" ] && ARGS+=(--pref "${{ inputs.pref }}")
            [ -n "${{ inputs.fish }}" ] && ARGS+=(--fish "${{ inputs.fish }}")
            ARGS+=(--platforms "${{ inputs.platforms }}")
          fi
          [ -n "${{ needs.gate.outputs.date }}" ] && ARGS+=(--date "${{ needs.gate.outputs.date }}")
          node scripts/sns/ranking-reel/run.mjs "${ARGS[@]}"

      - name: 生成物を保存（確認用・7日）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sns-ranking-${{ github.run_id }}
          path: out/sns-ranking/
          retention-days: 7

      - name: Discord通知（異常終了）
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ **SNSランキング投稿** ワークフロー失敗\\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
