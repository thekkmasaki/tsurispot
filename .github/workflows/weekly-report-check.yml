name: 釣果週報の取りこぼし検知

# 週報は毎週水曜12時にローカルの定期タスク（Claude デスクトップの「毎週水曜12時 釣果週報」）が自動実行する。
# 水曜16時ごろに「前回から6日以上経っている＝今週分が出ていない（PC・アプリ停止や失敗）」なら知らせ、木曜朝にも未実行なら再通知する。
# 最新週に主要10エリアの欠けがあるときも知らせる。
# 生成自体はローカルの /weekly-report（Claude）なので、ここでは検知と通知だけ行う。
on:
  schedule:
    - cron: '17 7 * * 3'    # 水 JST 16:17（12時の自動実行の後。GitHubの遅延で夕方になることがある）
    - cron: '17 23 * * 3'   # 木 JST 8:17（再通知）
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
      MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 検知
        run: node scripts/sns/weekly-carousel/check-fresh.mjs
