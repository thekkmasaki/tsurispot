name: 釣果週報の取りこぼし検知

# 週報は毎週木曜に出す運用（週末の直前に直近7日の釣果を出す）。
# 木曜朝に「前回から6日以上経っている＝今週分がまだ」なら実行を促し、金曜にも未実行なら再通知する。
# 最新週に主要10エリアの欠けがあるときも知らせる。
# 生成自体はローカルの /weekly-report（Claude）なので、ここでは検知と通知だけ行う。
on:
  schedule:
    - cron: '17 23 * * 3,4'   # 木・金 JST 8:17（GitHubの遅延で昼ごろになることがある）
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
      MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 検知
        run: node scripts/sns/weekly-carousel/check-fresh.mjs
