name: 釣果週報カルーセル（Instagram・X）

# 週報（microCMS の chouka-shuho-*）の釣果まとめを Instagram カルーセル1本と X 1件（画像4枚＋記事リンク）で投稿する。
# 投稿済みは媒体ごとに管理（片方が失敗したら、その媒体だけ次回やり直す）。
# 本命: /weekly-report の最後に workflow_dispatch（dry_run=false, force=true）で即投稿。
# 保険: 毎日 JST 19:00 ごろに未投稿の最新週が出揃っていれば投稿（投稿済みなら何もしない）。
#   GitHub の定時実行は5〜10時間遅れるため、早めに起動して gate ジョブで JST 18:55 まで待つ。
#   遅れて日付をまたいだ（JST 0〜12時）起動は待たずにそのまま投稿する。
# 生成器: scripts/sns/weekly-carousel/
on:
  schedule:
    - cron: '17 6 * * *'   # JST 15:17 起動 → 18:55 まで待つ（ランキング投稿の20:00と重ねない）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せずDiscordに画像プレビューだけ送る'
        type: boolean
        default: true
      week:
        description: '対象週（例: 2026-11-week2）。空なら最新週'
        required: false
      force:
        description: '週報が出揃ったかの判定を飛ばす'
        type: boolean
        default: false

concurrency:
  group: sns-weekly-carousel
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 投稿時刻（JST 18:55）まで待つ
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then exit 0; fi
          h=$(TZ=Asia/Tokyo date +%-H)
          if [ "$h" -lt 12 ]; then echo "JST ${h}時の起動（遅延で日付をまたいだ）→ 待たずに投稿"; exit 0; fi
          now=$(date +%s); target=$(TZ=Asia/Tokyo date -d "today 18:55" +%s)
          if [ "$now" -lt "$target" ]; then echo "JST 18:55 まで $(( (target-now)/60 ))分待つ"; sleep $((target-now)); fi

  post:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
      MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-1
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      # YouTube ショート（scripts/sns/youtube-auth.mjs で登録。未登録の間は投稿しない）
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # API 審査が通るまでは private 固定（YouTube 側で強制）。審査後に repo variable YOUTUBE_PRIVACY=public
      YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'private' }}
      SNS_BGM_DIR: /tmp/bgm
      # BGM を絞る（ファイル名の一部をカンマ区切り。空なら全曲から週ごとに選ぶ）
      SNS_BGM_PICK: ${{ vars.SNS_BGM_PICK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存インストール
        run: npm ci

      - name: 描画環境（Chromium・日本語/絵文字フォント）
        run: |
          npx playwright install chromium --with-deps
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji

      - name: BGM取得（非公開バケット。曲は再配布禁止のためリポジトリに置かない）
        run: |
          mkdir -p /tmp/bgm
          aws s3 sync s3://tsurispot-sns-assets/bgm/ /tmp/bgm/ --only-show-errors || echo "BGMなし（無音で続行）"
          ls /tmp/bgm

      - name: 生成して投稿
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=(--dry-run)
            [ "${{ inputs.force }}" = "true" ] && ARGS+=(--force)
            [ -n "${{ inputs.week }}" ] && ARGS+=(--week "${{ inputs.week }}")
          fi
          node scripts/sns/weekly-carousel/run.mjs "${ARGS[@]}"

      - name: 生成物を保存（確認用・7日）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sns-weekly-${{ github.run_id }}
          path: |
            out/sns-weekly/**/slide-*.jpg
            out/sns-weekly/**/caption-instagram.txt
            out/sns-weekly/**/caption-x.txt
            out/sns-weekly/**/short-*.mp4
            out/sns-weekly/**/youtube-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Discord通知（異常終了）
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ **釣果週報カルーセル** ワークフロー失敗\\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
