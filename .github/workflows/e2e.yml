# Playwright E2E を nightly + 手動 + ラベル駆動で実行する。
# PR 毎には走らせない: next dev のコールドコンパイルで実行時間が読めず、
# WIP コミット運用のテンポを壊すため。master への回帰は nightly が翌朝までに検知し、
# UI 大改修時だけ PR に run-e2e ラベルを付けて能動実行する。
# 対象は pages/flows/security の12 spec のみ。auth 系（Cognito/セッション依存）は
# flaky で「落ちても信じられないチェック」になるため初期スコープから除外する。
name: E2E

on:
  # nightly は一時無効。PR #311 の初回実走で、既存 E2E が CI の next dev
  # コールドコンパイルに未適合と判明（検索オーバーレイ Ctrl+K 等が5s timeout）。
  # 毎晩赤い「信用できないチェック」を避けるため、テスト安定化までは手動 + ラベルのみ。
  # 安定化後に下記を復活させる。
  # schedule:
  #   - cron: '0 18 * * *' # JST 3:00（UTC 18:00）毎日
  workflow_dispatch: {}
  pull_request:
    types: [labeled]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # schedule / 手動 / run-e2e ラベル付与時のみ実行（他ラベルでは走らせない）
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # playwright.config.ts の webServer が起動する next dev 用（runner側なのでローカルビルド禁止に抵触しない）
      NODE_OPTIONS: --max-old-space-size=4096
      MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
      MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存インストール
        run: npm ci

      - name: Playwright ブラウザ導入
        run: npx playwright install chromium --with-deps

      - name: E2E 実行（pages/flows/security・chromium・auth除外）
        run: npx playwright test e2e/pages e2e/flows e2e/security --project=chromium

      - name: レポート保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
